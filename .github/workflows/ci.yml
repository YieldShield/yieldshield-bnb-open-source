name: BNB testnet checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web
      - run: npm run test:bnb
      - name: Inherited Base regression tests
        run: npm run test:base
      - run: npm run lint
      - name: Test the live-check signing restrictions without broadcasting
        run: node --test scripts/bsc-e2e-check.test.mjs
      - run: npm audit --audit-level=moderate
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm ci --prefix contracts --ignore-scripts
      - run: npm audit --prefix contracts --audit-level=moderate
      - run: npm run check:foundry-lock --prefix contracts
      - run: npm run test:scripts --prefix contracts
      - name: Module and deployment lifecycle regressions
        working-directory: contracts
        run: forge test --match-path 'test/base-modules/*.t.sol' --extra-output storageLayout
      - name: Inherited stock oracle and relay regressions
        working-directory: contracts
        run: forge test --match-path 'test/Base*.t.sol' --extra-output storageLayout
      - name: BSC synthetic protection and chain guards
        working-directory: contracts
        run: forge test --match-path 'test/Bsc*.t.sol' --extra-output storageLayout
      - name: Inherited reward accounting regressions
        working-directory: contracts
        run: forge test --match-path 'test/SplitRiskPoolAuditFollowupB.t.sol' --extra-output storageLayout
      - run: node scripts/verify-base-modules.mjs
      - name: Yield demo initializer storage and size guards
        run: node scripts/verify-bsc-yield-layout.mjs
      - name: Yield demo deployment and proof regressions
        run: node --test scripts/bsc-yield-assets.test.mjs
